[project]
name = "{{cookiecutter.package_name}}"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.10.20,<4"
dependencies = [
    "fastmcp>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3.0,<2",
    {%- if cookiecutter.use_ruff == 'y' %}
    "ruff>=0.15,<1",{% endif %}
    {%- if cookiecutter.use_mypy == 'y' %}
    "mypy>=1,<2",{% endif %}
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

{%- if cookiecutter.use_ruff == 'y' %}

[tool.ruff]
line-length = 88

{%- endif %}
{%- if cookiecutter.use_mypy == 'y' %}

[tool.mypy]
ignore_missing_imports = true
files = "{{cookiecutter.package_name}},tests"
{%- endif %}
